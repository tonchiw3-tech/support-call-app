<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サポートコール｜スタッフ用画面</title>
  <style>
    :root {
      --blue: #1769aa;
      --dark-blue: #123f67;
      --ink: #17324d;
      --muted: #53697c;
      --line: #c6d5e0;
      --cream: #fffaf2;
      --pending-bg: #fff5d6;
      --pending-text: #805b00;
      --done-bg: #e8f6ed;
      --done-text: #17613b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--cream);
      font-family: -apple-system, BlinkMacSystemFont, "Yu Gothic", Meiryo, sans-serif;
      font-size: 18px;
      line-height: 1.6;
    }

    button { font: inherit; }

    .page {
      width: min(920px, calc(100% - 24px));
      margin: auto;
      padding: 24px 0 48px;
    }

    .hero {
      padding: 30px 28px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--dark-blue));
      border-radius: 20px;
      box-shadow: 0 8px 24px #17324d22;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.1rem);
      line-height: 1.25;
      letter-spacing: .04em;
    }

    .subtitle {
      margin: 7px 0 0;
      font-size: clamp(1.25rem, 3vw, 1.6rem);
      font-weight: bold;
    }

    .content {
      margin-top: 26px;
      padding: 28px;
      background: #fff;
      border: 1px solid #e2ebf0;
      border-radius: 20px;
      box-shadow: 0 8px 24px #17324d22;
    }

    .section-heading {
      margin: 0 0 20px;
      font-size: clamp(1.4rem, 3vw, 1.8rem);
    }

    .request-list {
      display: grid;
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .request-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: center;
      padding: 22px;
      border: 3px solid var(--line);
      border-radius: 18px;
      background: #fff;
    }

    .room-number {
      margin: 0;
      color: var(--dark-blue);
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      font-weight: bold;
      line-height: 1.3;
    }

    .request-text {
      margin: 7px 0 9px;
      font-size: clamp(1.2rem, 3vw, 1.55rem);
      font-weight: bold;
      line-height: 1.45;
    }

    .request-time {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 13px;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: bold;
    }

    .status.pending {
      color: var(--pending-text);
      background: var(--pending-bg);
    }

    .status.done {
      color: var(--done-text);
      background: var(--done-bg);
    }

    .confirm-button {
      min-width: 150px;
      min-height: 72px;
      padding: 14px 20px;
      color: #fff;
      background: var(--blue);
      border: 0;
      border-radius: 14px;
      box-shadow: 0 5px 0 var(--dark-blue);
      cursor: pointer;
      font-size: 1.25rem;
      font-weight: bold;
    }

    .confirm-button:hover:not(:disabled) { background: var(--dark-blue); }

    .confirm-button:focus-visible {
      outline: 4px solid #f3c95b;
      outline-offset: 3px;
    }

    .confirm-button:disabled {
      color: var(--done-text);
      background: var(--done-bg);
      box-shadow: none;
      cursor: default;
    }

    @media (max-width: 620px) {
      .page { padding-top: 10px; }
      .hero, .content { padding: 22px 18px; border-radius: 16px; }
      .request-card { grid-template-columns: 1fr; gap: 16px; padding: 18px; }
      .confirm-button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>サポートコール</h1>
      <p class="subtitle">スタッフ用画面</p>
    </header>

    <section class="content" aria-labelledby="request-title">
      <h2 id="request-title" class="section-heading">届いている依頼</h2>
      <ul id="request-list" class="request-list" aria-live="polite"></ul>
    </section>
  </main>

  <script>
    const requests = [
      { room: '305号室', text: 'シーツ交換をしてほしい', time: '21:55', status: '未確認' },
      { room: '208号室', text: 'お水を持ってきてほしい', time: '22:03', status: '未確認' },
      { room: '412号室', text: '家族に電話してほしい', time: '22:10', status: '未確認' }
    ];

    const requestList = document.querySelector('#request-list');

    function renderRequests() {
      requestList.replaceChildren(...requests.map((request, index) => {
        const item = document.createElement('li');
        item.className = 'request-card';

        const details = document.createElement('div');
        const room = document.createElement('p');
        room.className = 'room-number';
        room.textContent = request.room;

        const text = document.createElement('p');
        text.className = 'request-text';
        text.textContent = request.text;

        const time = document.createElement('p');
        time.className = 'request-time';
        time.textContent = `依頼時刻 ${request.time}`;

        const status = document.createElement('span');
        status.className = `status ${request.status === '確認済み' ? 'done' : 'pending'}`;
        status.textContent = request.status;

        details.append(room, text, time, status);

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'confirm-button';
        button.textContent = request.status === '確認済み' ? '確認済み' : '確認する';
        button.disabled = request.status === '確認済み';
        button.setAttribute('aria-label', `${request.room}の依頼を確認する`);
        button.addEventListener('click', () => {
          requests[index].status = '確認済み';
          renderRequests();
        });

        item.append(details, button);
        return item;
      }));
    }

    renderRequests();
  </script>
</body>
</html>
