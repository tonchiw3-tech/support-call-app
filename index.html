<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サポートコール</title>
  <style>
    :root { --blue:#1769aa; --dark:#123f67; --ink:#17324d; --line:#c6d5e0; --cream:#fffaf2; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--cream); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif; font-size:18px; line-height:1.6; }
    button { font:inherit; }
    .page { width:min(920px,calc(100% - 24px)); margin:auto; padding:24px 0 48px; }
    .hero { padding:30px 28px; color:#fff; background:linear-gradient(135deg,var(--blue),var(--dark)); border-radius:20px; box-shadow:0 8px 24px #17324d22; }
    .hero p { margin:6px 0 0; font-size:clamp(1.2rem,3vw,1.5rem); font-weight:bold; }
    h1 { margin:0; font-size:clamp(2rem,5vw,3.1rem); line-height:1.25; letter-spacing:.04em; }
    .content { margin-top:26px; padding:28px; background:#fff; border:1px solid #e2ebf0; border-radius:20px; box-shadow:0 8px 24px #17324d22; }
    h2 { margin:0 0 18px; font-size:clamp(1.35rem,3vw,1.75rem); }
    .request-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:0; padding:0; list-style:none; }
    .request-button { position:relative; width:100%; min-height:82px; padding:16px 52px 16px 20px; color:var(--ink); text-align:left; background:#fff; border:3px solid var(--line); border-radius:15px; cursor:pointer; font-size:1.2rem; font-weight:bold; line-height:1.4; }
    .request-button::after { content:""; position:absolute; top:50%; right:18px; width:22px; height:22px; border:3px solid #aabcc9; border-radius:50%; transform:translateY(-50%); }
    .request-button:hover, .request-button[aria-pressed="true"] { border-color:var(--blue); }
    .request-button:focus-visible, .submit-button:focus-visible { outline:4px solid #f3c95b; outline-offset:3px; }
    .request-button[aria-pressed="true"] { color:var(--dark); background:#eaf5fc; box-shadow:0 0 0 2px #1769aa22; }
    .request-button[aria-pressed="true"]::after { background:var(--blue); border-color:var(--blue); box-shadow:inset 0 0 0 5px #eaf5fc; }
    .summary { min-height:42px; margin:22px 0 24px; padding:9px 14px; color:#53697c; background:#f7fafc; border-left:5px solid var(--line); }
    .summary.selected { color:var(--dark); background:#eaf5fc; border-left-color:var(--blue); font-weight:bold; }
    .submit-button { display:block; width:min(100%,520px); min-height:76px; margin:auto; padding:15px 22px; color:#fff; background:var(--blue); border:0; border-radius:15px; box-shadow:0 5px 0 var(--dark); cursor:pointer; font-size:1.35rem; font-weight:bold; }
    .submit-button:hover:not(:disabled) { background:var(--dark); }
    .submit-button:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
    .message { display:none; margin:24px 0 0; padding:20px; color:#146c4a; background:#eaf8f1; border:2px solid #95d4b8; border-radius:14px; font-size:1.3rem; font-weight:bold; text-align:center; }
    .message.visible { display:block; }
    @media (max-width:620px) { .page{padding-top:10px;} .hero,.content{padding:22px 18px;border-radius:16px;} .request-list{grid-template-columns:1fr;gap:11px;} .request-button{min-height:72px;font-size:1.12rem;} }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>サポートコール</h1>
      <p>サポートナースに依頼する内容を選んでください</p>
    </header>

    <section class="content" aria-labelledby="request-title">
      <h2 id="request-title">依頼する内容</h2>
      <ul class="request-list">
        <li><button type="button" class="request-button" aria-pressed="false">買い物（売店へ買い物に行ってほしい）</button></li>
        <li><button type="button" class="request-button" aria-pressed="false">掃除をしてほしい</button></li>
        <li><button type="button" class="request-button" aria-pressed="false">お風呂の準備をしてほしい</button></li>
        <li><button type="button" class="request-button" aria-pressed="false">ゴミを捨ててほしい</button></li>
        <li><button type="button" class="request-button" aria-pressed="false">電気がつかない</button></li>
        <li><button type="button" class="request-button" aria-pressed="false">物を探してほしい</button></li>
        <li><button type="button" class="request-button" aria-pressed="false">トイレを片付けてほしい</button></li>
        <li><button type="button" class="request-button" aria-pressed="false">家族に電話してほしい</button></li>
        <li><button type="button" class="request-button" aria-pressed="false">シーツ交換をしてほしい</button></li>
        <li><button type="button" class="request-button" aria-pressed="false">その他</button></li>
      </ul>
      <p id="summary" class="summary" aria-live="polite">依頼内容を選ぶと、ここに表示されます。</p>
      <button id="submit" class="submit-button" type="button" disabled>この内容で依頼する</button>
      <p id="message" class="message" role="status">サポートナースに依頼しました</p>
    </section>
  </main>

  <script>
    const buttons = document.querySelectorAll('.request-button');
    const submit = document.querySelector('#submit');
    const summary = document.querySelector('#summary');
    const message = document.querySelector('#message');
    let selected = null;

    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        if (selected) selected.setAttribute('aria-pressed', 'false');
        selected = button;
        selected.setAttribute('aria-pressed', 'true');
        submit.disabled = false;
        summary.textContent = `選択中：${selected.textContent}`;
        summary.classList.add('selected');
        message.classList.remove('visible');
      });
    });

    submit.addEventListener('click', () => {
      if (selected) message.classList.add('visible');
    });
  </script>
</body>
</html>
