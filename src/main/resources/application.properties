spring.application.name=support-call-app
server.port=8080
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/support_call_app?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.supportcall.model
mybatis.configuration.map-underscore-to-camel-case=true
spring.thymeleaf.cache=false
