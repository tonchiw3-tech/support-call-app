<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>対応履歴</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="page"><header class="hero"><h1>対応履歴</h1><p>完了した依頼</p></header><section class="content"><ul class="request-list"><li class="request-card completed" th:each="request : ${requests}"><div><p class="room-number" th:text="${request.roomNumber + '号室'}"></p><p th:text="${request.requestContent}"></p><span class="status completed">対応済み</span><p th:text="${'対応終了日時 ' + #temporals.format(request.completedAt,'yyyy年M月d日 HH:mm')}"></p></div></li><li class="empty" th:if="${#lists.isEmpty(requests)}">対応履歴はありません</li></ul><a class="link-button" th:href="@{/staff}">スタッフ画面へ戻る</a></section></main></body></html>
