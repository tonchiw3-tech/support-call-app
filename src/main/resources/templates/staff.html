<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スタッフ画面</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="page"><header class="hero"><h1>サポートコール</h1><p>スタッフ用画面</p></header><section class="content"><h2>現在の依頼一覧</h2><ul class="request-list"><li class="request-card" th:each="request : ${requests}"><div><p class="room-number" th:text="${request.roomNumber + '号室'}"></p><p th:text="${request.requestContent}"></p><p th:text="${'依頼日時 ' + #temporals.format(request.requestedAt,'yyyy年M月d日 HH:mm')}"></p><span class="status" th:classappend="${request.status}" th:text="${request.status == 'pending' ? '未確認' : '確認済み'}"></span></div><div class="action-stack"><form th:if="${request.status == 'pending'}" th:action="@{'/staff/requests/' + request.id + '/confirm'}" method="post"><button class="action-button" type="submit">確認する</button></form><form th:if="${request.status == 'confirmed'}" th:action="@{'/staff/requests/' + request.id + '/complete'}" method="post"><button class="action-button complete" type="submit">対応終了</button></form></div></li><li class="empty" th:if="${#lists.isEmpty(requests)}">現在、対応中の依頼はありません</li></ul><a class="link-button" th:href="@{/staff/history}">対応履歴を見る</a></section></main></body></html>
