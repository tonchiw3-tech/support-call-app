<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サポートコール</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="page"><header class="hero"><h1>サポートコール</h1><p>患者用画面</p></header><section class="content"><h2>依頼を送る</h2><form th:action="@{/requests}" method="post"><label for="roomNumber">部屋番号</label><input class="room-input" id="roomNumber" name="roomNumber" th:value="${roomNumber}" inputmode="numeric" required><h2>依頼する内容</h2><div class="request-list"><label class="request-button" th:each="content : ${ {'買い物','掃除','お風呂の準備','ゴミ捨て','電気がつかない','物を探してほしい','トイレを片付けてほしい','家族に電話してほしい','シーツ交換','その他'} }"><input type="radio" name="requestContent" th:value="${content}" required><span th:text="${content}"></span></label></div><button class="submit-button" type="submit">この内容で依頼する</button></form><p class="message" th:if="${param.sent}">スタッフに依頼を送りました</p><section class="completion-panel" th:if="${latest != null and latest.status == 'completed'}"><h2>対応が完了しました</h2><p th:text="${latest.requestContent}"></p><p th:text="${#temporals.format(latest.completedAt,'yyyy年M月d日 HH:mm')} + ' にスタッフが対応しました'"></p></section><section class="completion-panel" th:if="${latest != null and latest.status != 'completed'}"><p>最新の依頼は「<span th:text="${latest.requestContent}"></span>」です。</p><p>現在の状態：<span th:text="${latest.status == 'pending' ? '未確認' : '確認済み'}"></span></p></section></section><a class="link-button" th:href="@{/staff}">スタッフ画面へ</a></main></body></html>
